apiVersion: apps/v1
kind: Deployment
metadata:
  name: tushar-web

spec:
  replicas: 2

  selector:
    matchLabels:
      app: tushar-web

  template:
    metadata:
      labels:
        app: tushar-web

    spec:
      containers:
        - name: tushar-web
          image: nginx:alpine

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi