apiVersion: apps/v1
kind: Deployment
metadata:
  name: tushar-web-docker
  labels:
    app: tushar-web-docker

spec:
  replicas: 2

  selector:
    matchLabels:
      app: tushar-web-docker

  template:
    metadata:
      labels:
        app: tushar-web-docker

    spec:
      containers:
        - name: devops-racer
          image: devops-racer
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi