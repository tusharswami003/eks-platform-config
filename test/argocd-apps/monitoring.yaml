apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: later-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tusharswami003/eks-platform-config.git
    targetRevision: main
    path: test/platform/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true