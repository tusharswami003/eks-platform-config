apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.7.0
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/test/platform/monitoring/values.yaml

    - repoURL: https://github.com/tusharswami003/eks-platform-config.git
      targetRevision: main
      ref: values

      path: test/platform/monitoring

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true